<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08090b">
  <meta name="description" content="AnimeDle infini : 8 mini-jeux Naruto, AOT, Tokyo Ghoul, Hunter x Hunter, Jujutsu Kaisen, Wordle, Image et Vidéo Mystère.">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <title>AnimeDle ∞ — Choisis ton jeu</title>
  <style>
    :root{color-scheme:dark;--bg:#08090b;--panel:#0f1114;--white:#f5f5f6;--muted:#a1a5aa}
    *{box-sizing:border-box}
    html{min-width:280px}
    body{margin:0;background:var(--bg);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
    a{color:inherit;text-decoration:none}
    a:focus-visible{outline:3px solid #dfebed;outline-offset:5px}
    .page{width:min(100%,796px);margin:0 auto;padding:clamp(20px,5vw,54px) clamp(14px,4vw,30px) 32px}
    .shell{padding:clamp(22px,4vw,38px);border:1px solid #262830;background:var(--panel);border-radius:24px;box-shadow:0 24px 70px #0005}
    .heading{padding:4px 4px 25px}
    h1{font-size:clamp(31px,5vw,43px);letter-spacing:-1.3px;line-height:1.1;margin:0 0 14px;font-weight:870}
    h1 span{font-weight:750;color:#d8dade}
    .subtitle{margin:0;color:#a3aca8;font-size:clamp(12px,2.8vw,15px);line-height:1.5;font-weight:760;letter-spacing:.1px}
    .tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,2.3vw,15px)}
    .tile{position:relative;isolation:isolate;overflow:hidden;min-width:0;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;min-height:clamp(159px,30vw,228px);padding:clamp(16px,3.2vw,25px);border:1px solid #ffffff08;border-radius:18px;transition:transform .2s,border-color .2s,filter .2s}
    .tile:hover{transform:translateY(-4px);border-color:#ffffff4f;filter:brightness(1.1)}
    .tile:active{transform:translateY(-1px)}
    .glyph{font-size:clamp(34px,5vw,51px);font-weight:780;line-height:1;color:#f5f5f5;user-select:none}
    .tile-title{font-size:clamp(13px,2.6vw,19px);font-weight:850;letter-spacing:-.45px;line-height:1.17;color:#fff;overflow-wrap:break-word}
    .tile .arrow{position:absolute;right:15px;bottom:15px;color:#ffffff8a;font-size:17px;opacity:0;transform:translate(-4px,4px);transition:opacity .2s,transform .2s}
    .tile:hover .arrow,.tile:focus-visible .arrow{opacity:1;transform:none}
    .naruto{background:#593a2e}.aot{background:#254b49}.tokyo{background:#4c2a4a}.hxh{background:linear-gradient(135deg,#254e35,#2a3b34)}.jjk{background:linear-gradient(135deg,#42304f,#2e2946)}.wordle{background:#252d29}.image{background:#292737}.video{background:#33292c;grid-column:1/-1;min-height:126px}
    .glyph.wordle-glyph{font-family:ui-sans-serif,system-ui;font-weight:850}
    .footer{text-align:center;margin:20px 0 0;color:#797c84;font-size:11px;line-height:1.7}
    .footer a{text-decoration:underline;text-underline-offset:3px}
    @media(max-width:480px){
      .page{padding:16px 12px 23px}
      .shell{padding:20px 16px;border-radius:20px}
      .heading{padding:3px 2px 22px}
      h1{font-size:32px;margin-bottom:12px}
      .subtitle{font-size:12px}
      .tiles{gap:11px}
      .tile{min-height:157px;padding:17px 14px;border-radius:17px}
      .glyph{font-size:38px}
      .tile-title{font-size:13px}
      .footer{font-size:10px}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
  <link rel="stylesheet" href="./tournoi.css?v=1">
</head>
<body>
  <main class="page">
    <section class="shell" aria-labelledby="homeTitle">
      <header class="heading">
        <h1 id="homeTitle">ANIMEDLE <span>∞</span></h1>
        <p class="subtitle">CHOISIS UN JEU. JOUE SANS LIMITE.</p>
      </header>
      <nav class="tiles" aria-label="Les huit jeux disponibles">
        <a class="tile naruto" href="./personnages.html#naruto" aria-label="Jouer à Narutodle">
          <span class="glyph" aria-hidden="true">忍</span><span class="tile-title">NARUTODLE</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="tile aot" href="./personnages.html#aot" aria-label="Jouer à AOTdle">
          <span class="glyph" aria-hidden="true">壁</span><span class="tile-title">AOTDLE</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="tile tokyo" href="./personnages.html#tokyo" aria-label="Jouer à Ghouldle">
          <span class="glyph" aria-hidden="true">喰</span><span class="tile-title">GHOULDLE</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="tile hxh" href="./personnages.html#hxh" aria-label="Jouer à Hunter x Hunterdle">
          <span class="glyph" aria-hidden="true">✦</span><span class="tile-title">HUNTER × HUNTERDLE</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="tile jjk" href="./personnages.html#jjk" aria-label="Jouer à JJKdle">
          <span class="glyph" aria-hidden="true">呪</span><span class="tile-title">JJKDLE</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="tile wordle" href="./wordle.html" aria-label="Jouer au Wordle infini">
          <span class="glyph wordle-glyph" aria-hidden="true">W</span><span class="tile-title">WORDLE ∞</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="tile image" href="./anime-mystery.html#image" aria-label="Jouer à Image Mystère">
          <span class="glyph" aria-hidden="true">▧</span><span class="tile-title">IMAGE MYSTÈRE</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="tile video" href="./anime-mystery.html#video" aria-label="Jouer à Vidéo Mystère">
          <span class="glyph" aria-hidden="true">▶</span><span class="tile-title">VIDÉO MYSTÈRE</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
    </section>
    <p class="footer">8 jeux · Parties illimitées · Gratuit · <a href="https://github.com/Rxse0/animedle-infini" target="_blank" rel="noopener noreferrer">Projet GitHub</a></p>
  </main>
  <script src="./tournoi.js?v=1" defer></script>
</body>
</html>
